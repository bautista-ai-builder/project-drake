services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drake
      POSTGRES_USER: drake
      POSTGRES_PASSWORD: drake
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drake -d drake"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - drake-postgres:/var/lib/postgresql/data

volumes:
  drake-postgres:

